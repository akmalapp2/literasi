# Menjaga Supabase (paket gratis) agar tidak ter-pause karena tidak aktif.
# Menyentuh database lewat endpoint /api/health setiap 3 hari.
#
# WAJIB: isi Secret bernama HEALTH_URL di GitHub:
#   Settings > Secrets and variables > Actions > New repository secret
#   Name : HEALTH_URL
#   Value: https://ALAMAT-APLIKASI-ANDA.vercel.app/api/health
name: Keepalive Supabase

on:
  schedule:
    - cron: '0 1 */3 * *' # tiap 3 hari, 01:00 UTC (~09:00 WITA)
  workflow_dispatch: {}     # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ secrets.HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "Secret HEALTH_URL belum diisi. Lihat komentar di file ini."
            exit 1
          fi
          echo "Menghubungi $URL"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "Percobaan $i: HTTP $CODE"
            cat /tmp/body.txt; echo
            if [ "$CODE" = "200" ]; then
              echo "Supabase aktif. Selesai."
              exit 0
            fi
            sleep 20
          done
          echo "Gagal setelah 5 percobaan."
          exit 1
